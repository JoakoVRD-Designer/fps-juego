<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITULO}}</title>
<meta name="description" content="Presentación de Exportaciones: tratados de libre comercio, ventajas, desafíos, Incoterms y un caso de importación en la pesca. INSUCO Bicentenario de Excelencia, Chillán.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --bg:#0a0a0c; --ink:#ffffff; --ink-2:#d7dade; --ink-3:#9aa0a6; --red:#ff3b4a; --line:#2a2c30; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font-family: Inter, Arial, sans-serif; -webkit-font-smoothing: antialiased; }

  #visor { position: fixed; inset: 0; overflow: hidden; }
  #escenario { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center center; transform: translate(-50%, -50%); background: var(--bg); overflow: hidden; }
  .slide { position: absolute !important; top: 0; left: 0; width: 1920px; height: 1080px; overflow: hidden; opacity: 0; visibility: hidden; transition: opacity .45s ease, visibility 0s linear .45s; }
  .slide.activa { opacity: 1; visibility: visible; transition: opacity .45s ease; z-index: 1; }
  .slide > * { position: relative; }
  .slide p, .slide h1, .slide h2 { margin: 0; }
  .slide video.fondo { background: #0a0a0c; }

  #barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: linear-gradient(0deg, rgba(10,10,12,.85), rgba(10,10,12,0)); opacity: 0; transition: opacity .3s; }
  body.mostrar #barra, #barra:focus-within { opacity: 1; }
  #barra button { font: 600 14px 'JetBrains Mono', monospace; color: var(--ink); background: rgba(16,16,19,.9); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; min-height: 40px; }
  #barra button:hover { border-color: var(--red); }
  #barra button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  #contador { font: 600 14px 'JetBrains Mono', monospace; color: var(--ink-2); letter-spacing: .08em; min-width: 64px; text-align: center; }
  #barra .sep { flex: 1; }
  #progreso { position: fixed; left: 0; top: 0; height: 4px; background: var(--red); z-index: 6; transition: width .4s ease; }

  #notas { position: fixed; right: 16px; top: 16px; bottom: 76px; width: min(520px, calc(100vw - 32px)); z-index: 7; background: rgba(16,16,19,.97); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; overflow: auto; display: none; }
  #notas.abierta { display: block; }
  #notas h3 { font: 600 13px 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--red); margin-bottom: 12px; }
  #notas div { font-size: 16px; line-height: 1.55; color: var(--ink-2); white-space: pre-line; }

  #ayuda { position: fixed; left: 50%; bottom: 72px; transform: translateX(-50%); z-index: 6; font: 500 13px 'JetBrains Mono', monospace; color: var(--ink-3); background: rgba(16,16,19,.9); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; white-space: nowrap; transition: opacity .6s; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
  #ayuda.oculta { opacity: 0; pointer-events: none; }

  @media (prefers-reduced-motion: reduce) { .slide, .slide.activa, #progreso { transition: none; } }
</style>
</head>
<body>
<div id="progreso" style="width:0"></div>
<div id="visor">
<div id="escenario" role="region" aria-roledescription="presentación" aria-label="{{TITULO}}">
{{SLIDES}}
</div>
</div>
<aside id="notas" aria-label="Notas del orador"><h3>Notas del orador</h3><div></div></aside>
<div id="ayuda">← → para avanzar · N notas · F pantalla completa</div>
<nav id="barra" aria-label="Controles">
  <button id="ant" type="button" aria-label="Diapositiva anterior">←</button>
  <span id="contador" aria-live="polite">1 / 1</span>
  <button id="sig" type="button" aria-label="Diapositiva siguiente">→</button>
  <span class="sep"></span>
  <button id="btnNotas" type="button" aria-pressed="false">Notas</button>
  <button id="btnFull" type="button">Pantalla completa</button>
</nav>
<script>
(function () {
  var NOTAS = {{NOTAS}};
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var escenario = document.getElementById('escenario');
  var contador = document.getElementById('contador');
  var progreso = document.getElementById('progreso');
  var panel = document.getElementById('notas');
  var actual = -1;

  function escalar() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    escenario.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }

  function cargar(i) {
    var sl = slides[i];
    if (!sl) return;
    sl.querySelectorAll('video[data-src]').forEach(function (v) {
      v.src = v.getAttribute('data-src');
      v.removeAttribute('data-src');
      v.preload = 'auto';
    });
  }

  function ir(i) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    if (i === actual) return;
    if (actual >= 0) {
      slides[actual].classList.remove('activa');
      slides[actual].setAttribute('aria-hidden', 'true');
      slides[actual].querySelectorAll('video').forEach(function (v) { v.pause(); });
    }
    actual = i;
    var sl = slides[i];
    cargar(i);
    sl.classList.add('activa');
    sl.removeAttribute('aria-hidden');
    sl.querySelectorAll('video').forEach(function (v) {
      try { v.currentTime = 0; } catch (e) {}
      var p = v.play();
      if (p && p.catch) p.catch(function () {});
    });
    cargar(i + 1);
    contador.textContent = (i + 1) + ' / ' + slides.length;
    progreso.style.width = ((i + 1) / slides.length * 100) + '%';
    panel.querySelector('div').textContent = NOTAS[i] || '';
    if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1));
  }

  function alternarNotas() {
    var abierta = panel.classList.toggle('abierta');
    document.getElementById('btnNotas').setAttribute('aria-pressed', abierta ? 'true' : 'false');
  }

  function pantallaCompleta() {
    var d = document.documentElement;
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (d.requestFullscreen) { d.requestFullscreen().catch(function () {}); }
  }

  slides.forEach(function (s) { s.setAttribute('aria-hidden', 'true'); });

  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') { e.preventDefault(); ir(actual + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); ir(actual - 1); }
    else if (k === 'Home') { ir(0); }
    else if (k === 'End') { ir(slides.length - 1); }
    else if (k === 'n' || k === 'N') { alternarNotas(); }
    else if (k === 'f' || k === 'F') { pantallaCompleta(); }
  });

  document.getElementById('visor').addEventListener('click', function (e) {
    if (window.getSelection && String(window.getSelection())) return;
    ir(e.clientX < window.innerWidth / 3 ? actual - 1 : actual + 1);
  });
  document.getElementById('ant').addEventListener('click', function () { ir(actual - 1); });
  document.getElementById('sig').addEventListener('click', function () { ir(actual + 1); });
  document.getElementById('btnNotas').addEventListener('click', alternarNotas);
  document.getElementById('btnFull').addEventListener('click', pantallaCompleta);

  var x0 = null, y0 = null;
  document.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) ir(actual + (dx < 0 ? 1 : -1));
    x0 = null;
  });

  var t;
  function mostrarBarra() {
    document.body.classList.add('mostrar');
    clearTimeout(t);
    t = setTimeout(function () { document.body.classList.remove('mostrar'); }, 2500);
  }
  document.addEventListener('mousemove', mostrarBarra);
  document.addEventListener('touchstart', mostrarBarra, { passive: true });

  setTimeout(function () { document.getElementById('ayuda').classList.add('oculta'); }, 4000);

  window.addEventListener('resize', escalar);
  window.addEventListener('hashchange', function () {
    var n = parseInt(location.hash.slice(1), 10);
    if (n) ir(n - 1);
  });

  escalar();
  var inicial = parseInt(location.hash.slice(1), 10);
  ir(inicial ? inicial - 1 : 0);
})();
</script>
</body>
</html>
